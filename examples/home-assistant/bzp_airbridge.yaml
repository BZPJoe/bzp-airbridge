# BZP Airbridge: estimated RF fan state, not physical feedback.
# Restore the last known estimate after reconnect/restart; sync in settings if needed.
input_select:
  bzp_airbridge_speed:
    name: BZP Airbridge remembered speed
    options: [Low, Medium, High]
  bzp_airbridge_estimated_state:
    name: BZP Airbridge resync estimated state
    icon: mdi:sync
    options: [Unsynced, "Off", Low, Medium, High]

script:
  bzp_airbridge_rf_send:
    alias: BZP Airbridge guarded RF send
    mode: single
    fields:
      command:
        required: true
        selector:
          select:
            options: [power_toggle, speed_up, speed_down]
    sequence:
      - condition: template
        value_template: "{{ command in ['power_toggle', 'speed_up', 'speed_down'] }}"
      - if:
          - condition: template
            value_template: "{{ not is_state('binary_sensor.bzp_airbridge_connected','on') or states('sensor.bzp_airbridge_bridge_activity').startswith('Listening') }}"
        then:
          - stop: "Airbridge is unavailable or learning; command not sent."
            error: true
      - action: button.press
        target:
          entity_id: "{{ 'button.bzp_airbridge_' ~ command }}"
      - delay: "00:00:02"
      - if:
          - condition: template
            value_template: "{{ not states('sensor.bzp_airbridge_bridge_activity').startswith('Replay completed') }}"
        then:
          - action: input_select.select_option
            target:
              entity_id: input_select.bzp_airbridge_estimated_state
            data:
              option: Unsynced
          - stop: "Airbridge did not report a completed replay; resync required."
            error: true

  bzp_airbridge_set_fan:
    alias: BZP Airbridge set fan
    description: Estimated RF control. Serialized requests; three speed steps. No fan reception feedback.
    mode: queued
    max: 10
    fields:
      level:
        required: true
        selector:
          number:
            min: 0
            max: 3
    sequence:
      - variables:
          requested: "{{ level | int(-1) }}"
          previous: "{{ states('input_select.bzp_airbridge_estimated_state') }}"
      - condition: template
        value_template: "{{ requested in [0,1,2,3] and previous in ['Off','Low','Medium','High'] }}"
      - condition: state
        entity_id: binary_sensor.bzp_airbridge_connected
        state: "on"
      - condition: template
        value_template: "{{ not states('sensor.bzp_airbridge_bridge_activity').startswith('Listening') }}"
      - choose:
          - conditions: "{{ requested == 0 and previous != 'Off' }}"
            sequence:
              - action: script.bzp_airbridge_rf_send
                data:
                  command: power_toggle
              - action: input_select.select_option
                target:
                  entity_id: input_select.bzp_airbridge_estimated_state
                data:
                  option: "Off"
          - conditions: "{{ requested > 0 }}"
            sequence:
              - if: "{{ previous == 'Off' }}"
                then:
                  - action: script.bzp_airbridge_rf_send
                    data:
                      command: power_toggle
                  # Normalize speed after power-on rather than assuming remembered speed.
                  - repeat:
                      count: 2
                      sequence:
                        - action: script.bzp_airbridge_rf_send
                          data:
                            command: speed_down
                  - action: input_select.select_option
                    target:
                      entity_id: input_select.bzp_airbridge_estimated_state
                    data:
                      option: Low
              - variables:
                  current: "{{ {'Low':1,'Medium':2,'High':3}.get(states('input_select.bzp_airbridge_estimated_state'), 1) }}"
              - repeat:
                  count: "{{ (requested - current) | abs }}"
                  sequence:
                    - action: script.bzp_airbridge_rf_send
                      data:
                        command: "{{ 'speed_up' if requested > current else 'speed_down' }}"
                    - action: input_select.select_option
                      target:
                        entity_id: input_select.bzp_airbridge_estimated_state
                      data:
                        option: "{{ ['Off','Low','Medium','High'][current + (repeat.index if requested > current else -repeat.index)] }}"

template:
  - fan:
      - name: BZP Airbridge
        unique_id: bzp_airbridge_fan
        default_entity_id: fan.bzp_airbridge
        availability: "{{ is_state('binary_sensor.bzp_airbridge_connected', 'on') and states('input_select.bzp_airbridge_estimated_state') in ['Off','Low','Medium','High'] }}"
        state: "{{ states('input_select.bzp_airbridge_estimated_state') in ['Low','Medium','High'] }}"
        percentage: "{{ {'Off':0,'Low':33,'Medium':66,'High':100}.get(states('input_select.bzp_airbridge_estimated_state'),0) }}"
        speed_count: 3
        attributes:
          assumed_state: "{{ true }}"
          state_source: "Estimated from RF commands; use resync after physical remote changes"
        turn_on:
          action: script.bzp_airbridge_set_fan
          data:
            level: "{{ {'Low':1,'Medium':2,'High':3}.get(states('input_select.bzp_airbridge_estimated_state'),3) }}"
        turn_off:
          action: script.bzp_airbridge_set_fan
          data:
            level: 0
        set_percentage:
          action: script.bzp_airbridge_set_fan
          data:
            level: "{{ 0 if percentage | float <= 0 else 1 if percentage | float <= 34 else 2 if percentage | float <= 67 else 3 }}"

automation:

  - id: bzp_airbridge_observe_remote
    alias: BZP Airbridge - Observe RF commands
    mode: queued
    max: 30
    triggers:
      - trigger: state
        entity_id: sensor.bzp_airbridge_observed_command
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state is not none and trigger.to_state.state.split(':') | length == 3 }}"
    actions:
      - variables:
          parts: "{{ trigger.to_state.state.split(':') }}"
          origin: "{{ parts[1] }}"
          slot: "{{ parts[2] | int(-1) }}"
          previous: "{{ states('input_select.bzp_airbridge_estimated_state') }}"
          before: "{{ trigger.from_state.state.split(':') if trigger.from_state is not none else [] }}"
      - condition: template
        value_template: "{{ (origin in ['rx','tx'] and slot in [0,1,2]) or (origin == 'sync' and slot in [0,1,2,3]) }}"
      - if:
          - condition: template
            value_template: "{{ before | length != 3 or (parts[0] | int(0)) != (before[0] | int(0)) + 1 }}"
        then:
          - stop: Reconnect snapshot or sequence gap; retain the last known estimate.
      - if: "{{ origin == 'sync' }}"
        then:
          - action: script.turn_off
            target:
              entity_id:
                - script.bzp_airbridge_set_fan
                - script.bzp_airbridge_rf_send
          - action: input_select.select_option
            target:
              entity_id: input_select.bzp_airbridge_estimated_state
            data:
              option: "{{ ['Off','Low','Medium','High'][slot] }}"
          - stop: State synced from the Airbridge settings page; no RF command sent.
      - if:
          - condition: template
            value_template: "{{ origin == 'rx' and is_state('script.bzp_airbridge_set_fan','on') }}"
        then:
          - action: script.turn_off
            target:
              entity_id:
                - script.bzp_airbridge_set_fan
                - script.bzp_airbridge_rf_send
          - action: input_select.select_option
            target:
              entity_id: input_select.bzp_airbridge_estimated_state
            data:
              option: Unsynced
          - stop: Physical remote interrupted an active sequence; resync required.
      # Existing fan script accounts for its own sends. Do not count those twice.
      - condition: template
        value_template: "{{ origin == 'rx' or not is_state('script.bzp_airbridge_set_fan','on') }}"
      - condition: template
        value_template: "{{ previous in ['Off','Low','Medium','High'] }}"
      - action: input_select.select_option
        target:
          entity_id: input_select.bzp_airbridge_estimated_state
        data:
          option: >-
            {% set levels = ['Off','Low','Medium','High'] %}
            {% set n = levels.index(previous) %}
            {% if slot == 0 %}
              {{ states('input_select.bzp_airbridge_speed') if n == 0 else 'Off' }}
            {% elif n == 0 %}
              Off
            {% elif slot == 1 %}
              {{ levels[[n+1,3] | min] }}
            {% else %}
              {{ levels[[n-1,1] | max] }}
            {% endif %}
  - id: bzp_airbridge_sync_selected_speed
    alias: BZP Airbridge - Remember speed
    triggers:
      - trigger: state
        entity_id: input_select.bzp_airbridge_estimated_state
    conditions:
      - condition: template
        value_template: "{{ trigger.to_state.state in ['Low','Medium','High'] }}"
    actions:
      - action: input_select.select_option
        target:
          entity_id: input_select.bzp_airbridge_speed
        data:
          option: "{{ trigger.to_state.state }}"

homekit:
  - name: BZP Airbridge
    port: 21268
    mode: bridge
    filter:
      include_entities:
        - fan.bzp_airbridge
    entity_config:
      fan.bzp_airbridge:
        name: BZP Airbridge
